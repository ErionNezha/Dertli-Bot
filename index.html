<!DOCTYPE html>
<!-- Created by Erion Nezha — © 2026 All rights reserved -->
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dertli Bot</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-shell">
  <header class="chat-header">
    <div class="bot-identity">
      <div class="bot-avatar" id="bot-avatar"><img src="logo.png" alt="Dertli Bot"></div>
      <div class="bot-titles">
        <div class="bot-name" id="bot-name">Dertli Bot</div>
        <div class="bot-subtitle" id="bot-subtitle"></div>
        <div class="bot-status"><span class="dot"></span> Online<span id="today-count"></span></div>
      </div>
    </div>
    <div class="header-actions">
      <a class="tg-icon-btn" href="https://t.me/dertlii_bot" target="_blank" rel="noopener" title="Vazhdo bisedën në Telegram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      </a>
    </div>
  </header>

  <main id="messages" class="chat-messages"></main>

  <div id="suggestions" class="suggestions"></div>

  <form id="chat-form" class="chat-input" autocomplete="off">
    <button id="attach-btn" type="button" class="icon-btn" title="Dërgo foto">📎</button>
    <input id="image-input" type="file" accept="image/*" hidden>
    <input id="user-input" type="text" placeholder="Shkruaj mesazhin..." autocomplete="off">
    <button id="mic-btn" type="button" class="icon-btn" title="Fol">🎤</button>
    <button id="send-btn" type="submit" title="Dërgo">➤</button>
  </form>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
