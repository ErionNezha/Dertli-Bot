<!DOCTYPE html>
<!-- Created by Erion Nezha — © 2026 All rights reserved -->
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dertli Bot</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
footer.kb-footer{text-align:center;padding:28px 16px 40px;color:#8fa3b8;font-size:.9rem}
footer.kb-footer strong{color:#e8eef4}
</style>
</head>
<body>

<div class="chat-shell">
  <header class="chat-header">
    <div class="bot-identity">
      <div class="bot-avatar" id="bot-avatar"><img src="logo.png" alt="Dertli Bot"></div>
      <div class="bot-titles">
        <div class="bot-name" id="bot-name">Dertli Bot</div>
        <div class="bot-subtitle" id="bot-subtitle"></div>
        <div class="bot-status"><span class="dot"></span> Online</div>
      </div>
    </div>
    <div class="header-actions">
    </div>
  </header>

  <main id="messages" class="chat-messages"></main>

  <div id="suggestions" class="suggestions"></div>

  <form id="chat-form" class="chat-input" autocomplete="off">
    <button id="attach-btn" type="button" class="icon-btn" title="Dërgo foto">📎</button>
    <input id="image-input" type="file" accept="image/*" hidden>
    <input id="user-input" type="text" placeholder="Shkruaj mesazhin..." autocomplete="off">
    <button id="mic-btn" type="button" class="icon-btn" title="Fol">🎤</button>
    <button id="send-btn" type="submit" title="Dërgo">➤</button>
  </form>
</div>

<script src="config.js"></script>
<script src="app.js"></script>

<footer class="kb-footer">Krijuar nga <strong>Erion Nezha</strong> &mdash; &copy; 2026</footer>
</body>
</html>
