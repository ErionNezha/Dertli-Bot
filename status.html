<!DOCTYPE html>
<!-- Created by Erion Nezha — © 2026 All rights reserved -->
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statusi — Dertli Bot</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--gold:#d4af37;--gold-bright:#f2d879;--bg:#0a0a0b;--panel:#111113;--text:#ececec;--muted:#a1a1aa;--line:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;color:var(--text);
background:radial-gradient(1200px 800px at 50% -10%,#151517 0%,var(--bg) 55%),var(--bg);
display:flex;align-items:center;justify-content:center;padding:20px 16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:24px;
padding:36px 28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(212,175,55,.06)}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid rgba(212,175,55,.5);
box-shadow:0 0 24px rgba(212,175,55,.25);margin-bottom:14px}
h1{font-size:22px;font-weight:600;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.status{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;
padding:12px 22px;border-radius:999px;border:1px solid var(--line);margin-bottom:24px}
.status .dot{width:12px;height:12px;border-radius:50%;background:#666}
.status.ok{border-color:rgba(74,222,128,.4);color:#4ade80}
.status.ok .dot{background:#4ade80;box-shadow:0 0 12px #4ade80;animation:pulse 2s infinite}
.status.bad{border-color:rgba(248,113,113,.4);color:#f87171}
.status.bad .dot{background:#f87171;box-shadow:0 0 12px #f87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:18px}
.cell{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px 6px}
.cell b{display:block;font-size:22px;color:var(--gold-bright);margin-bottom:4px}
.cell span{font-size:11.5px;color:var(--muted)}
.time{font-size:12px;color:var(--muted);margin-bottom:20px}
.back{display:inline-block;color:var(--gold);text-decoration:none;font-size:14px;font-weight:600}
.back:hover{color:var(--gold-bright)}
.note{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="logo.png" alt="Dertli Bot">
  <h1>Dertli Bot</h1>
  <div class="sub">Statusi i shërbimit · Service status</div>
  <div id="status" class="status"><span class="dot"></span><span id="status-text">Po kontrollohet…</span></div>
  <div class="grid">
    <div class="cell"><b id="st-total">–</b><span>Mesazhe sot</span></div>
    <div class="cell"><b id="st-blocked">–</b><span>Të bllokuara</span></div>
    <div class="cell"><b id="st-lock">–</b><span>Lockdown-e</span></div>
    <div class="cell"><b id="st-faq">–</b><span>Të shpejta</span></div>
  </div>
  <div id="st-time" class="time"></div>
  <a class="back" href="/">← Kthehu te biseda · Back to chat</a>
  <div class="note">Kontroll automatik çdo 60 sekonda.<br>Përditësohet nga serveri, pa prekur kuotat e ofruesve.</div>
</div>
<script>
function setStatus(ok, txt){
  var el = document.getElementById("status");
  el.className = "status " + (ok ? "ok" : "bad");
  document.getElementById("status-text").textContent = txt;
}
function refresh(){
  fetch("/.netlify/functions/chat?stats=1").then(function(r){
    if(!r.ok) throw new Error("http");
    return r.json();
  }).then(function(s){
    setStatus(true, "Të gjitha sistemet funksionale");
    document.getElementById("st-total").textContent = (s && typeof s.total === "number") ? s.total : "–";
    document.getElementById("st-blocked").textContent = (s && typeof s.rateLimited === "number") ? s.rateLimited : "–";
    document.getElementById("st-lock").textContent = (s && typeof s.lockdownImposed === "number") ? s.lockdownImposed : "–";
    document.getElementById("st-faq").textContent = (s && typeof s.faqHits === "number") ? s.faqHits : "–";
    document.getElementById("st-time").textContent = "Përditësuar: " + new Date().toLocaleTimeString("sq-AL") + " · " + new Date().toLocaleDateString("sq-AL");
  }).catch(function(){
    setStatus(false, "Probleme me shërbimin");
  });
}
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
